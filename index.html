<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMusic - Повна музика</title>
    <!-- Підключаємо Tailwind CSS для крутого дизайну -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключаємо іконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Кастомний скролбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #282828; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #1db954; }
        .playing-animation { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(29, 185, 84, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(29, 185, 84, 0); }
            100% { box-shadow: 0 0 0 0 rgba(29, 185, 84, 0); }
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden font-sans">

    <!-- Основна частина (Сайдбар + Контент) -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Сайдбар -->
        <div class="w-64 bg-zinc-900 p-6 flex flex-col gap-6">
            <div class="text-2xl font-bold text-green-500 flex items-center gap-2">
                <i class="fa-solid fa-compact-disc fa-spin"></i> MyMusic
            </div>
            
            <nav class="flex flex-col gap-4">
                <button onclick="loadTrending()" id="nav-home" class="flex items-center gap-4 text-zinc-300 hover:text-white font-semibold transition text-left">
                    <i class="fa-solid fa-fire text-xl w-6"></i> В тренді
                </button>
                <button onclick="showPlaylist()" id="nav-playlist" class="flex items-center gap-4 text-zinc-300 hover:text-white font-semibold transition text-left">
                    <i class="fa-solid fa-heart text-xl w-6 text-green-500"></i> Мій Плейліст
                    <span id="playlist-count" class="bg-zinc-800 text-xs px-2 py-1 rounded-full ml-auto">0</span>
                </button>
            </nav>

            <div class="mt-auto text-xs text-zinc-500">
                Працює на базі Audius API. Повні версії треків.
            </div>
        </div>

        <!-- Головний контент -->
        <div class="flex-1 bg-zinc-950 flex flex-col overflow-hidden">
            
            <!-- Шапка з пошуком -->
            <header class="p-6 bg-zinc-900/50 flex items-center gap-4 sticky top-0 z-10 backdrop-blur-md">
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-zinc-400"></i>
                    <input type="text" id="search-input" placeholder="Шукати пісні, виконавців або ремікси..." 
                        class="w-full bg-zinc-800 text-white rounded-full py-2.5 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-green-500"
                        onkeypress="if(event.key === 'Enter') searchMusic()">
                </div>
                <button onclick="searchMusic()" class="bg-green-500 hover:bg-green-600 text-black font-bold py-2.5 px-6 rounded-full transition">
                    Знайти
                </button>
            </header>

            <!-- Список треків -->
            <main class="flex-1 overflow-y-auto p-6">
                <h1 id="page-title" class="text-3xl font-bold mb-6">В тренді зараз</h1>
                
                <!-- Спінер завантаження -->
                <div id="loader" class="hidden flex justify-center items-center py-20">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-green-500"></i>
                </div>

                <!-- Сітка з треками -->
                <div id="tracks-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 pb-24">
                    <!-- Картки треків будуть додаватися сюди через JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Нижній плеєр -->
    <div class="h-24 bg-zinc-900 border-t border-zinc-800 px-6 flex items-center justify-between z-20">
        <!-- Інфо про поточний трек -->
        <div class="flex items-center gap-4 w-1/3">
            <img id="player-art" src="https://via.placeholder.com/60?text=Music" class="w-14 h-14 rounded-md object-cover">
            <div class="overflow-hidden">
                <div id="player-title" class="font-bold text-sm truncate">Трек не обрано</div>
                <div id="player-artist" class="text-xs text-zinc-400 truncate">Оберіть пісню зі списку</div>
            </div>
        </div>

        <!-- Кнопки управління та прогрес -->
        <div class="flex flex-col items-center w-1/3">
            <div class="flex items-center gap-6 mb-2">
                <button onclick="prevTrack()" class="text-zinc-400 hover:text-white text-lg"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition">
                    <i class="fa-solid fa-play ml-0.5"></i>
                </button>
                <button onclick="nextTrack()" class="text-zinc-400 hover:text-white text-lg"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="w-full flex items-center gap-2 text-xs text-zinc-400">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" max="100" class="w-full accent-green-500 h-1 bg-zinc-700 rounded-lg cursor-pointer" oninput="seekTrack()">
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <!-- Гучність -->
        <div class="flex items-center justify-end gap-3 w-1/3">
            <i class="fa-solid fa-volume-high text-zinc-400"></i>
            <input type="range" id="volume-bar" value="100" max="100" class="w-24 accent-green-500 h-1 bg-zinc-700 rounded-lg cursor-pointer" oninput="changeVolume()">
        </div>
    </div>

    <script>
        // Глобальні змінні
        let apiHost = '';
        let currentTracksList = []; // Список треків на екрані
        let playingQueue = [];      // Черга відтворення
        let currentTrackIndex = -1;
        let myPlaylist = JSON.parse(localStorage.getItem('myMusicPlaylist')) || [];
        
        const audio = new Audio();
        const APP_NAME = 'MyCoolMusicAppUA';

        // Ініціалізація при завантаженні
        window.onload = async () => {
            updatePlaylistCount();
            await getApiHost();
            loadTrending();
        };

        // 1. Отримуємо робочий сервер Audius API
        async function getApiHost() {
            try {
                const res = await fetch('https://api.audius.co');
                const data = await res.json();
                apiHost = data.data[0]; // Беремо перший доступний сервер
            } catch (e) {
                console.error('Помилка підключення до API:', e);
                alert('Не вдалося підключитися до музичного сервера.');
            }
        }

        // 2. Завантаження популярних треків
        async function loadTrending() {
            if (!apiHost) await getApiHost();
            showLoader(true);
            document.getElementById('page-title').innerText = '🔥 В тренді зараз';
            
            try {
                const res = await fetch(`${apiHost}/v1/tracks/trending?app_name=${APP_NAME}&limit=30`);
                const data = await res.json();
                currentTracksList = data.data;
                renderTracks(currentTracksList);
            } catch (e) {
                console.error(e);
            }
            showLoader(false);
        }

        // 3. Пошук музики
        async function searchMusic() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            
            showLoader(true);
            document.getElementById('page-title').innerText = `🔍 Результати пошуку: "${query}"`;

            try {
                const res = await fetch(`${apiHost}/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=${APP_NAME}`);
                const data = await res.json();
                currentTracksList = data.data;
                renderTracks(currentTracksList);
            } catch (e) {
                console.error(e);
            }
            showLoader(false);
        }

        // 4. Відображення карток треків
        function renderTracks(tracks) {
            const container = document.getElementById('tracks-container');
            container.innerHTML = '';

            if (tracks.length === 0) {
                container.innerHTML = `<p class="text-zinc-500 col-span-full">Нічого не знайдено.</p>`;
                return;
            }

            tracks.forEach((track, index) => {
                // Перевірка чи є трек у плейлісті
                const inPlaylist = myPlaylist.some(t => t.id === track.id);
                const heartClass = inPlaylist ? 'fa-solid text-green-500' : 'fa-regular text-zinc-400 hover:text-white';
                
                // Отримуємо обкладинку або ставимо заглушку
                const artwork = track.artwork ? track.artwork['480x480'] : 'https://via.placeholder.com/300?text=No+Cover';

                const card = document.createElement('div');
                card.className = 'bg-zinc-900 p-4 rounded-lg hover:bg-zinc-800 transition group relative flex flex-col';
                card.innerHTML = `
                    <div class="relative mb-4">
                        <img src="${artwork}" class="w-full aspect-square object-cover rounded-md shadow-lg">
                        <button onclick="playFromList(${index})" class="absolute bottom-2 right-2 w-12 h-12 bg-green-500 text-black rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition shadow-xl hover:scale-105">
                            <i class="fa-solid fa-play ml-1 text-lg"></i>
                        </button>
                    </div>
                    <div class="font-bold text-sm truncate mb-1" title="${track.title}">${track.title}</div>
                    <div class="text-xs text-zinc-400 truncate mb-3">${track.user.name}</div>
                    
                    <div class="mt-auto flex justify-between items-center pt-2 border-t border-zinc-800/50">
                        <span class="text-[10px] text-zinc-500">${formatTime(track.duration)}</span>
                        <button onclick="togglePlaylist('${track.id}')" class="text-lg transition">
                            <i id="heart-${track.id}" class="${heartClass} fa-heart"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- ЛОГІКА ПЛЕЄРА ---

        function playFromList(index) {
            playingQueue = [...currentTracksList];
            currentTrackIndex = index;
            loadAndPlayCurrentTrack();
        }

        function loadAndPlayCurrentTrack() {
            if (currentTrackIndex < 0 || currentTrackIndex >= playingQueue.length) return;
            
            const track = playingQueue[currentTrackIndex];
            const streamUrl = `${apiHost}/v1/tracks/${track.id}/stream?app_name=${APP_NAME}`;
            
            audio.src = streamUrl;
            audio.play();

            // Оновлення UI плеєра
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.user.name;
            document.getElementById('player-art').src = track.artwork ? track.artwork['150x150'] : 'https://via.placeholder.com/60';
            document.getElementById('player-art').classList.add('playing-animation');
            
            updatePlayButton(true);
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                updatePlayButton(true);
                document.getElementById('player-art').classList.add('playing-animation');
            } else {
                audio.pause();
                updatePlayButton(false);
                document.getElementById('player-art').classList.remove('playing-animation');
            }
        }

        function updatePlayButton(isPlaying) {
            const btn = document.getElementById('play-btn');
            btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play ml-0.5"></i>';
        }

        function nextTrack() {
            if (currentTrackIndex < playingQueue.length - 1) {
                currentTrackIndex++;
                loadAndPlayCurrentTrack();
            }
        }

        function prevTrack() {
            if (currentTrackIndex > 0) {
                currentTrackIndex--;
                loadAndPlayCurrentTrack();
            }
        }

        // Оновлення прогрес-бару
        audio.addEventListener('timeupdate', () => {
            const progress = document.getElementById('progress-bar');
            const currentTxt = document.getElementById('current-time');
            const durationTxt = document.getElementById('duration-time');

            if (audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
                currentTxt.innerText = formatTime(audio.currentTime);
                durationTxt.innerText = formatTime(audio.duration);
            }
        });

        // Автоперемикання на наступний трек
        audio.addEventListener('ended', nextTrack);

        function seekTrack() {
            const progress = document.getElementById('progress-bar');
            if (audio.duration) {
                audio.currentTime = (progress.value / 100) * audio.duration;
            }
        }

        function changeVolume() {
            const volume = document.getElementById('volume-bar').value;
            audio.volume = volume / 100;
        }

        // --- ЛОГІКА ПЛЕЙЛІСТА (LocalStorage) ---

        function togglePlaylist(trackId) {
            // Шукаємо трек у поточному списку або в самому плейлісті
            const track = currentTracksList.find(t => t.id === trackId) || myPlaylist.find(t => t.id === trackId);
            if (!track) return;

            const existingIndex = myPlaylist.findIndex(t => t.id === trackId);
            const heartIcon = document.getElementById(`heart-${trackId}`);

            if (existingIndex > -1) {
                // Видаляємо
                myPlaylist.splice(existingIndex, 1);
                if(heartIcon) {
                    heartIcon.className = 'fa-regular text-zinc-400 hover:text-white fa-heart';
                }
                // Якщо ми зараз на сторінці плейліста, оновлюємо її
                if (document.getElementById('page-title').innerText.includes('Плейліст')) {
                    showPlaylist();
                }
            } else {
                // Додаємо
                myPlaylist.push(track);
                if(heartIcon) {
                    heartIcon.className = 'fa-solid text-green-500 fa-heart';
                }
            }

            // Зберігаємо в браузері
            localStorage.setItem('myMusicPlaylist', JSON.stringify(myPlaylist));
            updatePlaylistCount();
        }

        function showPlaylist() {
            document.getElementById('page-title').innerText = '💚 Мій Плейліст';
            currentTracksList = [...myPlaylist];
            renderTracks(currentTracksList);
        }

        function updatePlaylistCount() {
            document.getElementById('playlist-count').innerText = myPlaylist.length;
        }

        // --- ДОПОМІЖНІ ФУНКЦІЇ ---

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function showLoader(show) {
            const loader = document.getElementById('loader');
            const container = document.getElementById('tracks-container');
            if (show) {
                loader.classList.remove('hidden');
                container.classList.add('hidden');
            } else {
                loader.classList.add('hidden');
                container.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
